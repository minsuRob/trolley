<!DOCTYPE html>

<body style="font: 13px -apple-system, sans-serif; margin: 0;">
<p><b>trolley</b>는 macOS 접근성 API로 GUI 앱을 조작하는 명령줄 도구이자 MCP 서버입니다.
스크린샷도, 좌표도, 비전 모델도 쓰지 않습니다.</p>

<p>설치되는 것:</p>
<ul>
  <li><code>/usr/local/trolley/bin/trolley</code> — 실행 파일</li>
  <li><code>/etc/paths.d/trolley</code> — 새 터미널에서 <code>trolley</code>로 바로 부를 수 있게 하는 PATH 등록</li>
</ul>

<p>설치 후 <b>두 단계</b>가 더 필요합니다. 마지막 화면에 그대로 적어드립니다.</p>
</body>
</html>
